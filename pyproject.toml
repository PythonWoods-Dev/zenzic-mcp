[project]
name = "zenzic-mcp"
version = "0.1.0"
description = "Model Context Protocol server exposing the Zenzic Deterministic Document Integrity Engine to LLM agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "PythonWoods", email = "dev@pythonwoods.dev" },
]
dependencies = [
    "mcp>=1.2.0",
    "zenzic~=0.31",
]

[project.scripts]
zenzic-mcp = "zenzic_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zenzic_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.13",
    "ruff==0.11.2",  # pinned to .pre-commit-config.yaml's ruff-pre-commit rev (v0.11.2)
    "reuse==6.2.0",  # pinned to .pre-commit-config.yaml's reuse-tool rev (v6.2.0)
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
# ServerRequestContext is a real, usable public class in this mcp SDK
# release, but the module omits it from __all__, so --strict's implicit
# no-implicit-reexport treats importing it as an error — an SDK packaging
# gap, not something this project's code can fix.
module = "mcp.server.runner"
implicit_reexport = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Bootstrap-stage floor: real measured coverage at time of writing is 82.57%
# with branch coverage counted (91 statements/18 branches, 13/6 missed —
# `uv run pytest tests/ --cov=src/zenzic_mcp --cov-report=term-missing`).
# Set with a ~7.5pt buffer below that, not at the ceiling, so small
# legitimate additions don't immediately break CI; ratchet up as the test
# suite and the 3-file `src/` surface both grow. Mirrors the Core
# repository's own `fail_under` precedent (`../zenzic/pyproject.toml`).
fail_under = 75
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.uv.sources]
# Local dev only: resolves the zenzic~=0.31 constraint above against the
# sibling checkout instead of PyPI, since v0.31.0 is not tagged/released yet.
# Remove once zenzic v0.31.0 ships to PyPI.
zenzic = { path = "../zenzic", editable = true }
